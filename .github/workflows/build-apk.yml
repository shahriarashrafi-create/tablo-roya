name: Build APK from uploaded ZIP

on:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk-from-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP safely
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.zip.outputs.file }}" -d extracted
          find extracted -type d -name __MACOSX -prune -exec rm -rf {} +

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(find extracted -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | sort | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android/Gradle project was not found inside the ZIP."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output
          find "${{ steps.project.outputs.dir }}" -type f -name '*-debug.apk' -exec cp {} apk-output/ \;
          test -n "$(find apk-output -type f -name '*.apk' -print -quit)" || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: generated-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
